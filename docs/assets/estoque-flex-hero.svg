<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Estoque Flex — controle confiável, estrutura flexível</title>
  <desc id="desc">Banner escuro em azul-petróleo com gradientes turquesa e âmbar, elementos de interface e barras abstratas que representam o fluxo de estoque.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071321"/><stop offset=".55" stop-color="#0c2638"/><stop offset="1" stop-color="#103c42"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64f0d0"/><stop offset="1" stop-color="#28b8c4"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd479"/><stop offset="1" stop-color="#f59e3d"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="44%" r="62%"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bdeee8" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020812" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
