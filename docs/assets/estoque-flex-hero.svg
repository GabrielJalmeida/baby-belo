    <text x="-2" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="800" letter-spacing="-2.4" fill="#f4fbff">Estoque <tspan fill="url(#accent)">Flex</tspan></text>
